版本: 1.3.0
说明: "每条旅程定义用户目标、点击路径、依赖和恢复。功能目录以旅程 ID 建立开发路径；所有条目等待人工审核。"
路由约定: "除根路径跳转外，下列 /... 均表示地域配置前缀后的路径模板；例如 /schedule 的实际路径是 /:profile/schedule，/ 表示 /:profile/。"
旅程:
  -
    id: JRN-001
    名称: "搜索落地与任务型首页"
    用户目标: "确认这是剧团官网并优先找到今夜或近期演出，再进入其他公开任务。"
    入口:
      - "搜索结果"
      - "外部深链接"
      - "站内 Logo"
    路由:
      - /
    模块:
      - core
    主流程:
      - "读取今夜/近期演出与状态"
      - "进入演出详情，或选择演出日历、剧目、剧团、巡演与到访"
      - "继续阅读公告、推荐剧目、剧团简介和到访提示"
      - "保留搜索与稳定演出版工具"
      - "继续到对应任务页"
    恢复:
      - "低带宽时显示静态节目单"
    产出: "明确的下一步任务"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-002
    名称: "演出日历、筛选与场次浏览"
    用户目标: "从未来场次列表或月历按剧目、城市、状态与可访问形式找到合适场次。"
    入口:
      - "首页今夜节目"
      - "主导航·演出日历"
    路由:
      - /schedule
    模块:
      - core
      - repertoire_archive
    主流程:
      - "默认读取未来场次列表，按需切换月历"
      - "设置剧目/城市/场次状态/可访问形式筛选"
      - "查看结果数与场次摘要"
      - "打开演出详情"
    恢复:
      - "无结果时建议放宽一个条件"
      - "清除全部筛选一步可达"
    产出: "选中的 performanceId"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-003
    名称: "演出与剧目详情、同剧其他日期"
    用户目标: "区分剧目制作与具体场次，并在理解时间、地点、阵容、时长和状态后做决定。"
    入口:
      - "日历场次卡"
      - "剧目列表"
      - "分享链接"
    路由:
      - /schedule/:performanceId
      - /repertoire/:slug
    模块:
      - core
      - repertoire_archive
    主流程:
      - "读取剧目或场次关键信息"
      - "浏览节目/阵容/时长/幕间"
      - "比较同剧其他日期"
      - "通过主操作查看场次状态或预约说明"
    恢复:
      - "待定时长显示状态而非空值"
      - "返回日历保留筛选与滚动位置"
    产出: "场次选择或可复现链接"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-004
    名称: "剧团、人物与制作部门"
    用户目标: "在一个公开机构页面内理解当前组织、部门、成员与时间边界。"
    入口:
      - "主导航·剧团"
      - "演出详情演职员"
      - "首页剧团简介"
    路由:
      - /troupe
    模块:
      - troupe_information
    主流程:
      - "阅读公开组织简介"
      - "按台前/乐团/舞台/巡演分组"
      - "在当前页面阅读部门与成员摘要"
      - "主动展开时间边界与证据层"
    恢复:
      - "缺某时期资料显示档案整理中"
      - "回到演出详情时保持场次"
    产出: "剧团页面中的人物/部门记录位置"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-005
    名称: "巡演到访与首次观演"
    用户目标: "理解如何抵达移动城市、进入场馆并完成一晚观演。"
    入口:
      - "主导航·巡演与到访"
      - "场次详情场馆链接"
      - "首次观演提示"
    路由:
      - /visit
    模块:
      - core
    主流程:
      - "在同一页面选择示例城市并确认抵达窗口"
      - "查看对应入口/候场/设施/技艺限制区块"
      - "阅读首次观演与迟到说明"
      - "返回场次；购票模块安装后才可进入该场次的购票流程"
    恢复:
      - "天灾或移动改线时显示场次状态并返回演出日历"
      - "路线图不可用时显示等价步骤列表"
    产出: "到访计划（本地、虚构）"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-006
    名称: "站内搜索、无结果与 404 找回"
    用户目标: "只用当前地域配置和网站版本获准公开的专名、同语言别名和公开文本找到内容，并在错误路径中安全返回。"
    入口:
      - "全局搜索"
      - "失效链接"
      - "手输 URL"
    路由:
      - /search
      - "/*"
    模块:
      - core
      - repertoire_archive
    主流程:
      - "输入专名或筛选类型"
      - "只在当前 localeProfileId + siteEditionId 的隔离索引中查询"
      - "用当前配置语言显示结果、摘要和链接"
      - "无结果时只给出当前配置语言的拼写或筛选建议"
      - "404 走廊仍提供首页和搜索"
    恢复:
      - "其他语言字段、炎国回退文本、其他网站版本和 background 不得产生搜索结果"
      - "谜题层不替代正常建议"
      - "真正返回 HTTP 404"
    产出: "目标内容或明确返回路径"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-007
    名称: "首次启幕与偏好设定"
    用户目标: "在不被片头阻挡的前提下选择动效和稳定演出版。"
    入口:
      - "首次访问首页"
    路由:
      - /
    模块:
      - core
    主流程:
      - "先显示可用首页"
      - "滚动或点击启幕"
      - "可选动效和稳定演出版"
      - "保存本地偏好"
    恢复:
      - "跳过片头立即可用"
      - "降低动效时直接切换静态状态"
    产出: "本地体验偏好"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-101
    名称: "选择分区并发起购票"
    用户目标: "为一个纯虚构场次选择席位分区，确认双币价格并发起世界观购票。"
    入口:
      - "演出详情 CTA"
      - "日历场次卡"
    路由:
      - /purchase/:performanceId
    模块:
      - repertoire_archive
      - purchase_flow
    主流程:
      - "从 URL 读取单个场次并确认开售状态"
      - "在完整分区图中选择 S/A/B/C/D/包厢等分区"
      - "查看固定 LMD 基准价与当前地域配置绑定的世界内币种"
      - "点击当前语言的购票主操作"
      - "进入结果判定"
    恢复:
      - "可以返回当前演出详情或演出日历"
      - "不在流程内换场、改签或暂存多个场次"
      - "本地存储不可用时只在当前页面会话中运行"
    产出: "当前流程内存中的 purchaseDraft"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-102
    名称: "开售、候补、外部主办与免票状态"
    用户目标: "理解当前可以采取的合法站内动作。"
    入口:
      - "场次卡状态"
      - "演出详情 CTA"
      - "票务说明"
    路由:
      - /schedule/:performanceId
      - /ticket-info
    模块:
      - repertoire_archive
      - purchase_flow
    主流程:
      - "读取开售状态"
      - "显示对应主操作与原因"
      - "候补/退回票/免票/外部主办走各自说明"
      - "可购票状态进入当前场次的购票流程；其他状态回到场次说明"
    恢复:
      - "未知状态禁用预约并给出说明"
      - "不用虚假倒计时推动选择"
    产出: "票务意图或提醒（本地）"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-103
    名称: "购票结果、重试与结局导演"
    用户目标: "在点击购票后获得可理解、可继续且不会长期卡住的世界观结果。"
    入口:
      - "购票主操作"
      - "结果页再次尝试"
    路由:
      - /purchase/:performanceId
    模块:
      - purchase_flow
    主流程:
      - "按随机种子、成就和近期结果选择当前操作允许的候选结果"
      - "结算叙事网络波动、正常渠道成功或正常渠道失败"
      - "正常渠道失败时挂接黄牛支线；插件不可用时提供重试和返回"
      - "显示结果、模拟费用和下一步"
      - "按硬性覆盖上限更新最小导演状态"
    恢复:
      - "失败时不提供可下载观演凭据，可重试当前场次或返回演出详情"
      - "同一可重试结果最多连续两次；成功可达路线不能连续卡住"
      - "存储不可用时仍可在当前页面会话内得到结果"
    产出: "Outcome ID 与更新后的 ticketExperienceState"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-104
    名称: "黄牛平台支线"
    用户目标: "识别并处理虚构票务讽刺，同时保留清晰退出。"
    入口:
      - "正常渠道购票失败"
    路由:
      - /purchase/:performanceId
    模块:
      - purchase_flow
      - ticket_game
    主流程:
      - "查看原价黄牛报价、手续费和双币种模拟金额"
      - "直接接受报价，或拒绝并收到一次 2% 挽留优惠"
      - "再次拒绝形成拒绝黄牛结局；接受原价或优惠报价后判定成功或失败"
      - "查看五个稳定黄牛结局之一及模拟费用"
      - "成功时进入观演凭据；失败时重试当前场次或返回演出详情"
    恢复:
      - "不设置强迫倒计时"
      - "拒绝和真正离开始终可达，挽留优惠不重复出现"
      - "黄牛插件失败时保留正常渠道结果与重试"
    产出: "五个黄牛 Outcome ID 之一"
    开发批次: M2
    人工审核: "待审"
  -
    id: JRN-105
    名称: "成就收集、提示与本地状态"
    用户目标: "在不建立账户或票据档案的前提下持续探索当前已安装的购票结局，并随时清除进度。"
    入口:
      - "任一购票结果页"
      - "购票体验设置"
    路由:
      - /purchase/:performanceId
    模块:
      - purchase_flow
    主流程:
      - "按稳定 Outcome ID 去重解锁成就"
      - "连续两个有效结果没有新成就时显示当前语言的低干扰路线提示"
      - "按当前已安装结果集提供可达提示；M2 安装黄牛支线后，遵循提示时在最多十二个有效结果内收齐七项成就"
      - "只在有效结算或导演计数更新时滚动续期三十天"
      - "按需清除全部购票体验状态"
    恢复:
      - "过期或清除后开始新的收集周期"
      - "本地存储不可用时退化为当前页面会话"
      - "提示不公开隐藏结局名称、概率或导演规则"
    产出: "最小、版本化且有期限的 ticketExperienceState"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-106
    名称: "观演凭据与七段组合印章"
    用户目标: "在购到票后获得 SVG/PNG 观演凭据，并用原创组合印章呈现已获得成就。"
    入口:
      - "购票成功结果卡"
    路由:
      - /purchase/:performanceId
    模块:
      - purchase_flow
      - souvenir_ticket
    主流程:
      - "读取本轮场次、分区、LMD 票面价和当前唯一成就集合"
      - "用七个稳定 stampSegmentId 渲染原创组合印章"
      - "为本次凭据生成不持久化的随机长条票纹"
      - "预览观演凭据与等价文本"
      - "下载 SVG 或 PNG"
    恢复:
      - "成功路线图形失败时显示等价纯文本凭据"
      - "失败路线只显示不可下载结果，并允许重试"
      - "重复结局不增加印章图层；下载文件不因后续成就改变"
      - "凭据不显示地区币、路线结果文字、连续序号或非现实声明"
      - "不建立本地凭据档案页"
    产出: "SVG/PNG 观演凭据与等价纯文本视图"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-201
    名称: "剧目、活页双面与节目洞察"
    用户目标: "从当前地域配置的公开节目说明进入猩红规则、音乐、幕后资料和可选证据对照。"
    入口:
      - "主导航·剧目"
      - "演出详情洞察"
      - "首页节目册"
    路由:
      - /repertoire
      - /repertoire/:slug
    模块:
      - repertoire_archive
    主流程:
      - "浏览剧目列表"
      - "阅读普通节目单面"
      - "主动翻到猩红面"
      - "主动进入证据视图查看三服差异与相关资料"
    恢复:
      - "无翻面动画仍能读两面"
      - "资料入口使用明确内容类型，不以锁或谜语隐藏必要摘要"
    产出: "剧目记录位置与阅读位置"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-203
    名称: "过往演出、新闻与剧务历史"
    用户目标: "使用普通剧团官网结构浏览历史演出、新闻和剧务沿革。"
    入口:
      - "历史演出入口"
      - "剧团历史"
      - "首页公告"
    路由:
      - /past-performances
      - /troupe/history
      - /news
      - /news/:slug
    模块:
      - repertoire_archive
      - troupe_information
      - core
    主流程:
      - "按时间浏览已结束演出"
      - "打开新闻或公告详情"
      - "阅读剧团公开历史和剧务记录"
      - "返回对应剧目、演出或剧团页面"
    恢复:
      - "历史内容不要求解锁、结局或活动状态"
      - "证据与跨语言对照只从明确的编辑入口进入"
    产出: "稳定的公开内容 URL"
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-207
    名称: "旧酒神历史网站发现、浏览与返回"
    用户目标: "从新酒神表网站发现一个带泰拉日期的旧酒神网站快照，浏览其独立历史内容并安全返回当前网站。"
    入口:
      - "M3 安装后的表网站页脚版本戳"
      - "已保存的历史快照直接链接"
    路由:
      - /archive/site/:terraDate
      - /archive/site/:terraDate/*
    模块:
      - historical_site
      - narrative_layer
    主流程:
      - "在表网站页脚发现低显著度版本戳"
      - "进入带捕获泰拉日期的历史网站"
      - "先阅读少量由里网站内容集预置的不可信信息或演出记录"
      - "按里网站独立路由浏览旧新闻、过去演出、人物和历史叙述"
      - "首次成功打开新页面或关键内容时累加本次访问进度，重复操作不计数"
      - "随有效探索逐级显示扭曲、涂抹和异常，在该快照的固定阈值后维持饱和"
      - "发现与表网站公开时间线有意冲突的内容"
      - "使用捕获栏或浏览器后退返回当前表网站"
    恢复:
      - "直接 URL、刷新、书签和浏览器后退不要求发现锁，也不依赖已发现快照标记"
      - "同一快照内部前进或后退保留进度；离开快照路由域、切换泰拉日期、刷新或重新进入即从基线开始"
      - "稳定演出版隐藏异常并暂停计数，关闭后从本次访问的同一进度继续"
      - "无 JavaScript 或降低动效时显示完整静态历史正文"
      - "里网站不显示预约、购票或观演凭据入口"
      - "错误先说明原因与返回路径，再附里网站沉浸文案"
    产出: "siteEditionId=old-dionysus 与仅限本次访问的异常进度"
    开发批次: M3
    人工审核: "待审"
  -
    id: JRN-301
    名称: "地域展示配置切换"
    用户目标: "在已启用的国家实体配置之间切换完整、沉浸且可审阅的页面。"
    入口:
      - "全局地域配置选择器"
      - "搜索页当前配置提示"
    路由:
      - "所有路由"
    模块:
      - i18n
    主流程:
      - "打开地域配置选择器"
      - "在当前阶段已启用的国家实体配置中选择"
      - "切换到目标配置的同一内容路径并尽量保留段落位置"
      - "原子更新文本、HTML 语言、格式、地域文案和币种"
      - "对回退字段显示低干扰来源说明"
    恢复:
      - "缺译文回退当前语言官方专名＋炎国正文"
      - "公开页面标注中文原文；开发预览另标待译"
      - "搜索索引和结果不使用炎国正文回退"
      - "目标地域未实现当前网站版本时不生成跨版本替代页"
      - "不自动倒译缺失官名"
    产出: localeProfileId
    开发批次: M1
    人工审核: "待审"
  -
    id: JRN-302
    名称: "地域化节目册呈现"
    用户目标: "在当前地域配置内获得一致的语言、日期、币种、节目册语体和局部装饰。"
    入口:
      - "地域配置选择器"
      - "场次城市提示"
    路由:
      - "所有内容路由"
    模块:
      - i18n
