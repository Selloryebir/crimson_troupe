      - repertoire_archive
    主流程:
      - "读取剧目或场次关键信息"
      - "浏览节目/阵容/时长/幕间"
      - "比较同剧其他日期"
      - "通过主操作查看场次状态或预约说明"
    恢复:
      - "待定时长显示状态而非空值"
      - "返回日历保留筛选与滚动位置"
    产出: "场次选择或可复现链接"
    开发批次: M0
    人工审核: "待审"
