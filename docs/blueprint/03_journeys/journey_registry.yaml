版本: 1.2.0
说明: "每条旅程定义用户目标、点击路径、依赖和恢复。功能目录以旅程 ID 建立开发路径；所有条目等待人工审核。"
路由约定: "除根路径跳转外，下列 /... 均表示地域配置前缀后的路径模板；例如 /schedule 的实际路径是 /:profile/schedule，/ 表示 /:profile/。"
旅程:
  -
    id: JRN-001
    名称: "搜索落地与任务型首页"
    用户目标: "确认这是剧团官网并优先找到今夜或近期演出，再进入其他公开任务。"
    入口:
      - "搜索结果"
      - "外部深链接"
      - "站内 Logo"
    路由:
      - /
    模块:
      - core
    主流程:
      - "读取今夜/近期演出与状态"
      - "进入演出详情，或选择演出日历、剧目、剧团、巡演与到访"
      - "继续阅读公告、推荐剧目、剧团简介和到访提示"
      - "保留搜索与稳定演出版工具"
      - "继续到对应任务页"
    恢复:
      - "低带宽时显示静态节目单"
      - "异常叙事可一键闭幕"
    产出: "明确的下一步任务"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-002
    名称: "演出日历、筛选与赛季浏览"
    用户目标: "从未来场次列表或月历按剧目、城市、状态与可访问形式找到合适场次。"
    入口:
      - "首页今夜节目"
      - "主导航·演出日历"
      - "历史演出入口"
    路由:
      - /schedule
    模块:
      - core
      - repertoire_archive
    主流程:
      - "默认读取未来场次列表，按需切换月历"
      - "设置剧目/城市/场次状态/可访问形式筛选"
      - "查看结果数与场次摘要"
      - "打开演出详情"
    恢复:
      - "无结果时建议放宽一个条件"
      - "清除全部筛选一步可达"
    产出: "选中的 performanceId"
    开发批次: M0
    人工审核: "待审"
  -
    id: JRN-003
    名称: "演出与剧目详情、同剧其他日期"
    用户目标: "区分剧目制作与具体场次，并在理解时间、地点、阵容、时长和状态后做决定。"
    入口:
      - "日历场次卡"
      - "剧目列表"
      - "分享链接"
    路由:
