  - global.footer-edition-stamp
路由:
  - /archive/site/:terraDate
  - /archive/site/:terraDate/*
依赖模块:
  []
内容准备依据:
  - docs/background/02_crimson_troupe/01_organization/01_组织与沿革.md
  - docs/background/02_crimson_troupe/01_organization/02_人物.csv
  - docs/background/02_crimson_troupe/02_history/02_专题时间注释.csv
  - docs/background/02_crimson_troupe/03_phantom_and_crimson_solitaire/04_活页剧目.csv
  - docs/background/02_crimson_troupe/03_phantom_and_crimson_solitaire/06_过往演出展览.csv
