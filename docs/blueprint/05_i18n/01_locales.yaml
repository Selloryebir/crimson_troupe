运行规则:
  - "路径、HTML 语言、世界内语言、国家实体和货币只通过本表关联，不根据名称推断。"
  - "配置名称仅用于技术文档辨识；选择器和页面显示文案从 background 官方专名或 content 工作译读取，不在蓝图中维护第二份文案。"
  - "HTML lang 只使用现实文本语言的有效 BCP 47 标签；地域配置 id 和路径不是语言标签。"
  - "切换配置时必须原子更新路径、文本资源、格式规则、地域文案和币种，不能保留另一配置的局部状态。"
  - "普通页面只显示当前配置中的专名；跨语言对照只出现在证据、档案或编辑预览中。"
  - "缺译字段回退到炎国配置，公开页面低干扰标注‘中文原文’，开发预览另标‘待译’。"
  - "background 中的官方专名只供内容准备和人工审阅；构建只读取经审核的 docs/content 内容集。"
  - "搜索按 localeProfileId + siteEditionId 独立生成索引；只读取当前组合获准公开的文本、专名和同语言别名。"
  - "搜索索引、结果、摘要、纠错和无结果提示不得使用其他地域配置、其他语言字段、炎国回退文本、其他网站版本或 background；缺少当前组合必要搜索文本的记录不进入该索引。"
  - "维多利亚与哥伦比亚即使共享英语基础资源，也按地域配置和网站版本分别生成索引，不互相带入资源覆盖、币种、地域文案或历史网站内容。"
  - "币种显示代码为空时显示币种全名和‘代码待审’，不得生成缩写。"
  - "汇率只接受人工硬编码值；缺失时使用 1:1 演示值并明确标注‘演示汇率/待人工审核’。"
  - "只有本表列出的十个配置进入实施计划；其他语言研究项不生成路由、选择器或货币映射。"
